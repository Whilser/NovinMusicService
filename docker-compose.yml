services:
  novin-music:
    build:
      context: .
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
    security_opt:
      - no-new-privileges:true
    environment:
      NOVIN_DATA_DIR: /data
      NOVIN_MUSIC_ROOT: /music
      TMPDIR: /run/novin
      SMB_USERNAME: ${SMB_USERNAME:-}
      SMB_PASSWORD: ${SMB_PASSWORD:-}
      MPD_PASSWORD: ${MPD_PASSWORD:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${NOVIN_BIND_ADDRESS:-127.0.0.1}:${NOVIN_PORT:-8000}:8000"
    volumes:
      - novin_data:/data
    tmpfs:
      - /run:rw,noexec,nosuid,nodev,size=16m,mode=0700
      - /music:rw,nosuid,nodev,size=16m,mode=0755
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 20s

volumes:
  novin_data:

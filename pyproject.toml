[project]
name = "novin-music-service"
version = "0.1.0"
description = "Personal NAS music catalog and MPD controller"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110,<1",
  "mutagen>=1.47,<2",
  "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1"]

[tool.unittest]
start-directory = "tests"
